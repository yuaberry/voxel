[package]
name = "nexuscraft-studio"
version = "0.16.0"
description = "NexusCraft Studio - AI Minecraft Creation Studio"
authors = ["Yua Devs"]
edition = "2021"

# The `_lib` suffix may seem redundant but it is necessary
# to make the lib target the unique coverage target in `tauri.conf.json > coverage`
[lib]
name = "nexuscraft_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
local-ip-address = "0.6"
include_dir = "0.7"
hickory-resolver = "0.25"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.13", features = ["blocking", "json", "stream"] }
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-http = "2.8.0"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
zip = "8.6.0"
sha2 = "0.11.0"
tauri-plugin-notification = "2.6.0"
png = "0.18"
base64 = "0.22"
toml = "0.8"
url = "2"
flate2 = "1.1"
pdf-extract = "0.12.1"
