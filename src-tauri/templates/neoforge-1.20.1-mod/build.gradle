plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.18+ ships Java 17 to end users; newer versions may require 21.
java.toolchain.languageVersion = JavaLanguageVersion.of({{JAVA_RELEASE}})

minecraft {
    // Official mappings: Mojang's own field/method names.
    // You must be aware of the Mojang license when using them:
    // https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    mappings channel: mapping_channel, version: mapping_version

    // Required so ProcessResources runs on IDE output locations before launching the game.
    copyIdeResources = true

    // Default run configurations. These can be tweaked, removed, or duplicated as needed.
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for additional dependencies here.
    // ForgeGradle automatically adds the Forge maven and Maven Central for you.
    // NeoForge 1.20.1 artifacts live on the NeoForged maven (the loader
    // itself is a Forge 47.x drop-in: net.neoforged:forge:<mc>-<neo>).
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    // NeoForge userdev artifact for development (1.20.1 lineage: a Forge
    // 47.x drop-in published by NeoForged). The "userdev" classifier
    // will be requested and set up by ForgeGradle.
    minecraft "net.neoforged:forge:${minecraft_version}-${forge_version}"
}

// Expand the declared properties into the resource targets.
// A missing property will result in an error.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors
        ])
    }

    finalizedBy 'reobfJar'
}

// Example for how to publish to a Maven repository. Configure the 'maven' extension.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
