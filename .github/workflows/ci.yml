name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter voxel --filter @voxel/core --filter @voxel/mine-rank-site
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      # the public Mine Rank site is a real app — a broken site fails the CI,
      # it never reaches GitHub Pages
      - name: Mine Rank site — typecheck and build
        run: |
          pnpm --filter @voxel/mine-rank-site typecheck
          pnpm --filter @voxel/mine-rank-site build

  rust:
    name: Rust — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux webkit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --workspace
        working-directory: src-tauri
